<script>
// Global chat state management with persistence
window.chatState = window.chatState || {
  initialized: false,
  isOpen: false,
  isProcessing: false,
  manager: null,
  lastResponse: null,
  miniMode: false,
  conversationHistory: [],
  currentPage: null,
  userType: 'explorer'
};

// Create safe copy of chat state without circular references
function createSafeChatState() {
  return {
    initialized: window.chatState.initialized,
    isOpen: window.chatState.isOpen,
    isProcessing: window.chatState.isProcessing,
    lastResponse: window.chatState.lastResponse,
    miniMode: window.chatState.miniMode,
    conversationHistory: window.chatState.conversationHistory || [],
    currentPage: window.chatState.currentPage,
    userType: window.chatState.userType
    // Intentionally exclude 'manager' to avoid circular references
  };
}

// Utility function to safely save chatState to localStorage
function saveChatState() {
  try {
    const safeState = createSafeChatState();
    localStorage.setItem('chatState', JSON.stringify(safeState));
  } catch (error) {
    console.warn('Failed to save chat state:', error);
  }
}

// Lightweight initialization - No WebLLM loading yet!
document.addEventListener('DOMContentLoaded', function() {
  
  // Clear any corrupted cache state from previous versions
  try {
    const savedState = localStorage.getItem('chatState');
    if (savedState) {
      const state = JSON.parse(savedState);
      // If old state has modelCached property, clear the cache
      if (state.hasOwnProperty('modelCached')) {
        console.log('Clearing old cache format...');
        localStorage.removeItem('chatState');
      }
    }
  } catch (error) {
    console.log('Clearing corrupted localStorage...');
    localStorage.removeItem('chatState');
  }
  const chatBtn = document.getElementById('talk-with-me-btn');
  const chatModal = document.getElementById('chat-modal');
  const closeBtn = document.getElementById('close-chat');
  const removeCacheBtn = document.getElementById('remove-cache-btn');
  const miniResponse = document.getElementById('mini-response');
  const expandBtn = document.getElementById('expand-chat');
  const closeMiniBtn = document.getElementById('close-mini');
  
  // Restore chat state from localStorage (conversation history only)
  const savedState = localStorage.getItem('chatState');
  if (savedState) {
    try {
      const state = JSON.parse(savedState);
      
      // Only restore conversation history and page context, not engine state
      if (state.conversationHistory && state.conversationHistory.length > 0) {
        window.chatState.conversationHistory = state.conversationHistory;
        console.log('Restored conversation history with', state.conversationHistory.length, 'messages');
      }
      
      // Restore page context and user type
      if (state.currentPage) {
        window.chatState.currentPage = state.currentPage;
        console.log('Restored page context:', state.currentPage);
      }
      
      if (state.userType) {
        window.chatState.userType = state.userType;
        console.log('Restored user type:', state.userType);
      }
      
      // Restore modal state if it was open
      if (state.isOpen) {
        chatModal.style.display = 'flex';
        window.chatState.isOpen = true;
      }
      
    } catch (error) {
      console.warn('Failed to parse saved chat state:', error);
      localStorage.removeItem('chatState'); // Clear corrupted state
    }
  }
  
  // Show modal on button click
  chatBtn.addEventListener('click', function() {
    chatModal.style.display = 'flex';
    window.chatState.isOpen = true;
    saveChatState();
    
    // Initialize chat only when first opened
    if (!window.chatState.initialized) {
      // Add timeout detection to prevent infinite loading
      setTimeout(() => {
        if (!window.chatState.initialized && window.chatState.isOpen) {
          console.warn('Chat initialization timed out after 60 seconds');
          const retryBtn = document.getElementById('retry-btn');
          if (retryBtn) {
            retryBtn.style.display = 'inline-block';
          }
          showChatError('Initialization timed out. Please try the retry button.');
        }
      }, 60000); // 60 second timeout
      
      initializeChat();
      window.chatState.initialized = true;
    } else {
      // Chat was already initialized, just show existing conversation if any
      if (window.chatState.conversationHistory && window.chatState.conversationHistory.length > 0) {
        console.log('Chat already initialized, restoring existing conversation...');
        // The conversation will be restored when the manager is created
      }
    }
  });
  
  // Close modal
  closeBtn.addEventListener('click', function() {
    chatModal.style.display = 'none';
    window.chatState.isOpen = false;
    saveChatState();
  });
  
  // Close on backdrop click
  chatModal.addEventListener('click', function(e) {
    if (e.target === chatModal) {
      chatModal.style.display = 'none';
      window.chatState.isOpen = false;
      saveChatState();
    }
  });
  
  // Remove cache functionality
  removeCacheBtn.addEventListener('click', function() {
    if (confirm('Are you sure you want to remove the model cache? This will delete the downloaded AI model and you will need to download it again next time you use the chat feature.')) {
      removeModelCache();
    }
  });
  
  // Mini response expand button
  expandBtn.addEventListener('click', function() {
    miniResponse.style.display = 'none';
    chatModal.style.display = 'flex';
    window.chatState.isOpen = true;
    window.chatState.miniMode = false;
    saveChatState();
  });
  
  // Mini response close button
  closeMiniBtn.addEventListener('click', function() {
    miniResponse.style.display = 'none';
    window.chatState.miniMode = false;
    saveChatState();
  });
  
  // Debug button functionality
  const debugBtn = document.getElementById('debug-btn');
  if (debugBtn) {
    debugBtn.addEventListener('click', function() {
      showDebugInfo();
    });
  }
  
  // Retry button functionality
  const retryBtn = document.getElementById('retry-btn');
  if (retryBtn) {
    retryBtn.addEventListener('click', function() {
      // Reset state and retry initialization
      retryBtn.disabled = true;
      retryBtn.textContent = '🔄 Retrying...';
      
      // Reset chat state
      window.chatState.initialized = false;
      window.chatState.isProcessing = false;
      
      // Clear error messages and show loading
      const messagesContainer = document.getElementById('chat-messages');
      if (messagesContainer) {
        messagesContainer.innerHTML = `
          <div class="loading-message" id="loading-message">
            <div class="loading-container">
              <div class="typing-indicator">
                <span></span><span></span><span></span>
              </div>
              <div class="loading-text">
                <h4 id="loading-stage">Retrying AI Chat...</h4>
                <p id="loading-details">Attempting to reload the AI model. Please wait...</p>
              </div>
              <div class="progress-container" id="progress-container" style="display: none;">
                <div class="progress-bar">
                  <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="progress-text" id="progress-text">0%</div>
              </div>
            </div>
          </div>
        `;
      }
      
      // Disable input again
      const input = document.getElementById('chat-input');
      const sendBtn = document.getElementById('send-btn');
      if (input) input.disabled = true;
      if (sendBtn) sendBtn.disabled = true;
      
      // Hide retry button during retry
      retryBtn.style.display = 'none';
      
      // Retry initialization after a short delay
      setTimeout(() => {
        initializeChat();
      }, 1000);
    });
  }
  
  // Handle page visibility changes
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && window.chatState.isOpen) {
      // User came back to the page and chat was open
      const chatModal = document.getElementById('chat-modal');
      if (chatModal.style.display !== 'flex') {
        chatModal.style.display = 'flex';
      }
      
      // Check if there's a pending response and show notification
      if (window.chatState.isProcessing && window.chatState.manager) {
        showResponseReadyNotification();
      }
    }
  });
});

// This function loads WebLLM and heavy JavaScript ONLY when needed
async function initializeChat() {
  console.log('Initializing chat - Loading WebLLM...');
  console.log('Current chat state:', {
    initialized: window.chatState.initialized,
    isOpen: window.chatState.isOpen,
    conversationHistory: window.chatState.conversationHistory?.length || 0
  });
  
  // Update initial loading stage
  const loadingStage = document.getElementById('loading-stage');
  const loadingDetails = document.getElementById('loading-details');
  
  if (loadingStage) {
    loadingStage.textContent = 'Loading Chat System';
  }
  if (loadingDetails) {
    loadingDetails.textContent = 'Downloading AI chat components...';
  }
  
  try {
    // Load WebLLM script dynamically
    const script = document.createElement('script');
    script.type = 'module';
    script.src = '/assets/js/webllm-chat.js';
    
    // Add timeout for script loading
    let scriptLoadTimeout = setTimeout(() => {
      console.error('Script loading timed out');
      showChatError('Script loading timed out. Please refresh and try again.');
      
      // Store timeout error
      const errors = JSON.parse(localStorage.getItem('chatErrors') || '[]');
      errors.push({
        timestamp: new Date().toISOString(),
        type: 'error',
        message: 'Script loading timed out after 30 seconds'
      });
      localStorage.setItem('chatErrors', JSON.stringify(errors.slice(-10)));
    }, 30000); // 30 second timeout
    
    script.onload = function() {
      clearTimeout(scriptLoadTimeout);
      console.log('WebLLM script loaded successfully');
      
      // Wait a moment for the script to fully initialize
      setTimeout(() => {
        if (typeof startRecruiterChat === 'function') {
          window.chatState.isProcessing = true;
          saveChatState();
          
          // Store successful script load
          const errors = JSON.parse(localStorage.getItem('chatErrors') || '[]');
          errors.push({
            timestamp: new Date().toISOString(),
            type: 'info',
            message: 'WebLLM script loaded successfully'
          });
          localStorage.setItem('chatErrors', JSON.stringify(errors.slice(-10))); // Keep last 10 entries
          
          startRecruiterChat();
        } else {
          const errorMsg = 'startRecruiterChat function not found after script load';
          console.error(errorMsg);
          
          // Store error
          const errors = JSON.parse(localStorage.getItem('chatErrors') || '[]');
          errors.push({
            timestamp: new Date().toISOString(),
            type: 'error',
            message: errorMsg
          });
          localStorage.setItem('chatErrors', JSON.stringify(errors.slice(-10)));
          
          showChatError('Failed to initialize chat system. Enabling fallback mode...');
          enableFallbackContactMode();
        }
      }, 100); // Small delay to ensure script is fully parsed
    };
    
    script.onerror = function(error) {
      clearTimeout(scriptLoadTimeout);
      const errorMsg = 'Failed to load webllm-chat.js script';
      console.error(errorMsg, error);
      
      // Store error
      const errors = JSON.parse(localStorage.getItem('chatErrors') || '[]');
      errors.push({
        timestamp: new Date().toISOString(),
        type: 'error',
        message: errorMsg + ' - Check network connectivity and script path'
      });
      localStorage.setItem('chatErrors', JSON.stringify(errors.slice(-10)));
      
      showChatError('Failed to load chat components. Enabling fallback mode...');
      enableFallbackContactMode();
    };
    
    document.head.appendChild(script);
    
  } catch (error) {
    console.error('Failed to load chat:', error);
    showChatError('Failed to load chat. Please refresh and try again.');
  }
}

function showChatError(message) {
  const loadingStage = document.getElementById('loading-stage');
  const loadingDetails = document.getElementById('loading-details');
  const retryBtn = document.getElementById('retry-btn');
  
  if (loadingStage) {
    loadingStage.textContent = 'Error';
    loadingStage.style.color = 'red';
  }
  if (loadingDetails) {
    loadingDetails.textContent = message;
    loadingDetails.style.color = 'red';
  }
  
  // Show retry button for AI loading errors
  if (retryBtn && message.includes('AI') || message.includes('model') || message.includes('script')) {
    retryBtn.style.display = 'inline-block';
  }
}

// Fallback contact mode when AI chat fails completely
function enableFallbackContactMode() {
  console.log('Enabling fallback contact mode...');
  
  // Hide loading message
  const loadingMsg = document.getElementById('loading-message');
  if (loadingMsg) {
    loadingMsg.style.display = 'none';
  }
  
  // Enable input
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  
  if (input) {
    input.disabled = false;
    input.placeholder = 'Ask about contacting Naren directly...';
  }
  if (sendBtn) {
    sendBtn.disabled = false;
    sendBtn.textContent = 'Send';
  }
  
  // Add fallback welcome message
  const messagesContainer = document.getElementById('chat-messages');
  if (messagesContainer) {
    const welcomeMessage = document.createElement('div');
    welcomeMessage.className = 'message assistant-message';
    welcomeMessage.innerHTML = `

// Show mini response with latest AI message
function showMiniResponse(responseText) {
  const miniResponse = document.getElementById('mini-response');
  const miniResponseText = document.getElementById('mini-response-text');
  
  if (miniResponse && miniResponseText) {
    // Store the response
    window.chatState.lastResponse = responseText;
    
    // Clean the response text first (remove JSON string formatting)
    let cleanText = responseText;
    if (typeof cleanText === 'string') {
      // Remove wrapping quotes if the entire content is wrapped in quotes
      if ((cleanText.startsWith('"') && cleanText.endsWith('"')) || 
          (cleanText.startsWith("'") && cleanText.endsWith("'"))) {
        cleanText = cleanText.slice(1, -1);
      }
      
      // Remove any JSON string escaping
      cleanText = cleanText.replace(/\\"/g, '"');
      cleanText = cleanText.replace(/\\'/g, "'");
      cleanText = cleanText.replace(/\\n/g, '\n');
      cleanText = cleanText.replace(/\\t/g, '\t');
      cleanText = cleanText.replace(/\\r/g, '\r');
      cleanText = cleanText.replace(/\\\\/g, '\\');
    }
    
    // Clean and truncate the response text
    cleanText = cleanText.replace(/\*\*([^*]+)\*\*/g, '$1'); // Remove markdown bold
    cleanText = cleanText.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1'); // Remove markdown links
    cleanText = cleanText.replace(/[\u{1f300}-\u{1f9ff}]/gu, ''); // Remove emojis
    cleanText = cleanText.replace(/\n\n+/g, ' '); // Replace multiple newlines with space
    cleanText = cleanText.replace(/\n/g, ' '); // Replace single newlines with space
    cleanText = cleanText.trim();
    
    // Truncate if too long
    if (cleanText.length > 200) {
      cleanText = cleanText.substring(0, 200) + '...';
    }
    
    if (miniResponseText) {
      miniResponseText.textContent = cleanText;
    }
    if (miniResponse) {
      miniResponse.style.display = 'block';
    }
    window.chatState.miniMode = true;
    saveChatState();
    
    // Auto-hide after 15 seconds
    setTimeout(() => {
      if (window.chatState.miniMode && miniResponse && miniResponse.style.display === 'block') {
        miniResponse.style.display = 'none';
        window.chatState.miniMode = false;
        saveChatState();
      }
    }, 15000);
  }
}

    window.chatState.manager.playNotificationSound();
  }
}

// Remove Model Cache Function
async function removeModelCache() {
  try {
    console.log('removeModelCache: Starting cache removal...');
    
    // Show loading state
    const removeCacheBtn = document.getElementById('remove-cache-btn');
    const originalText = removeCacheBtn.textContent;
    removeCacheBtn.textContent = 'removing...';
    removeCacheBtn.disabled = true;
    
    // Clear WebLLM cache through IndexedDB
    if ('indexedDB' in window) {
      // Clear WebLLM specific databases
      const dbsToDelete = ['webllm-cache', 'webllm', 'mlc-cache'];
      
      for (const dbName of dbsToDelete) {
        try {
          const deleteRequest = indexedDB.deleteDatabase(dbName);
          await new Promise((resolve, reject) => {
            deleteRequest.onerror = () => resolve(); // Don't fail if DB doesn't exist
            deleteRequest.onsuccess = () => resolve();
            deleteRequest.onblocked = () => resolve();
          });
          console.log(`Deleted database: ${dbName}`);
        } catch (error) {
          console.log(`Could not delete database ${dbName}:`, error);
        }
      }
    }
    
    // Clear localStorage chat state
    localStorage.removeItem('chatState');
    localStorage.removeItem('webllm-cache');
    localStorage.removeItem('mlc-cache');
    localStorage.removeItem('chatErrors');
    
    // Clear sessionStorage
    sessionStorage.removeItem('chatState');
    sessionStorage.removeItem('webllm-cache');
    
    // Reset global state
    window.chatState = {
      initialized: false,
      isOpen: false,
      isProcessing: false,
      manager: null,
      lastResponse: null,
      miniMode: false,
      conversationHistory: []
    };
    
    // Clear global engine reference
    if (window.globalChatEngine) {
      try {
        // Try to properly dispose of the engine if it has cleanup methods
        if (window.globalChatEngine.dispose) {
          await window.globalChatEngine.dispose();
        }
      } catch (error) {
        console.log('Engine cleanup error:', error);
      }
      window.globalChatEngine = null;
    }
    
    // Clear chat messages
    const messagesContainer = document.getElementById('chat-messages');
    if (messagesContainer) {
      messagesContainer.innerHTML = `
        <div class="loading-message" id="loading-message">
          <div class="loading-container">
            <div class="typing-indicator">
              <span></span><span></span><span></span>
            </div>
            <div class="loading-text">
              <h4 id="loading-stage">Model Cache Removed</h4>
              <p id="loading-details">AI model cache has been cleared. The model will need to be downloaded again next time you start a chat.</p>
            </div>
          </div>
        </div>
      `;
    }
    
    // Disable chat input
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    if (chatInput) chatInput.disabled = true;
    if (sendBtn) sendBtn.disabled = true;
    
    // Show success message
    console.log('removeModelCache: Cache removal completed successfully');
    
    // Reset button
    setTimeout(() => {
      removeCacheBtn.textContent = originalText;
      removeCacheBtn.disabled = false;
    }, 2000);
    
    // Optional: Show success notification
    alert('Model cache removed successfully! The chat will need to download the AI model again next time you use it.');
    
  } catch (error) {
    console.error('removeModelCache: Error removing cache:', error);
    
    // Reset button on error
    const removeCacheBtn = document.getElementById('remove-cache-btn');
    removeCacheBtn.textContent = 'remove cache';
    removeCacheBtn.disabled = false;
    
    // Show error message
    alert('Error removing cache: ' + error.message);
  }
}
