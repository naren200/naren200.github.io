<head>

  {% assign title = page.title | default: site.title | escape %}

  <meta name="google-site-verification" content="a_EMbZFV11aUw0TNGcOXf612e0NmsY0DwU4erXZk5QE" />

  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ title }}</title>

  <link rel="shortcut icon" type="image/x-icon" href="{{ '/assets/favicon.ico' | relative_url }}">

  <!-- Jekyll SEO Tag: canonical URL, meta description, Open Graph, Twitter Card, WebSite/Person JSON-LD -->
  {% seo title=false %}

  <!-- Explicit Person schema, included via head.html on every page so there is exactly
       one definition of this entity (single source of truth) reused site-wide -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.author.name }}",
    "url": "{{ site.url }}{{ site.baseurl }}/",
    "image": "{{ site.url }}{{ site.baseurl }}/{{ site.author.image }}",
    "jobTitle": "Robotics & AI Engineer",
    "description": "Robotics & ML Engineer with an MS in Robotics & AI, building tactile sensing for humanoid robots and ROS2 systems.",
    "sameAs": [
      "https://github.com/{{ site.author.github }}",
      "https://www.linkedin.com/in/{{ site.author.linkedin }}",
      "https://twitter.com/{{ site.author.twitter }}"
    ]
  }
  </script>

  <meta name="robots" content="index, follow, max-image-preview:large">

  <!-- Embed mode: when a page is loaded inside the in-page project viewer (?embed=1),
       strip the site chrome so it reads as a nested panel, not the full site. Runs
       before paint to avoid a navbar flash. -->
  <script>
    if (location.search.indexOf('embed=1') !== -1) {
      document.documentElement.className += ' embed-view';
      // Inside the viewer iframe, external links must open in a new tab —
      // otherwise clicking one navigates the iframe to a site (e.g. GitHub)
      // that refuses framing, breaking the drawer. Same-page fragments and
      // same-origin links are left to behave normally.
      document.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[href]');
        if (!a) return;
        var href = a.getAttribute('href') || '';
        if (href.charAt(0) === '#') return;
        if (a.hostname && a.hostname !== location.hostname) {
          a.target = '_blank';
          a.rel = 'noopener';
        }
      }, true);
    }
  </script>
  <style>
    html.embed-view nav.navbar,
    html.embed-view footer { display: none !important; }
    html.embed-view body { background: transparent; }
    /* Use the drawer's full width — drop Bootstrap's centered narrow column,
       container max-width, and the project overlay's padding so content isn't
       hemmed in by empty side margins. */
    html.embed-view main.container { max-width: 100% !important; margin-top: 0 !important; padding: 0; }
    html.embed-view .overlay { padding: 0 !important; backdrop-filter: none; border-radius: 0; }
    html.embed-view .col-lg-10 { max-width: 100% !important; flex: 0 0 100% !important; margin-top: 0 !important; }
    html.embed-view .post { padding: 20px 26px; }
  </style>

  <!-- Theme style -->
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.10.0/css/all.css">

  <!-- Bootstrap CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">


  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
